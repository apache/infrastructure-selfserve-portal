name: Lint
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  pylint:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/tag=infra
    strategy:
      matrix:
        python-version: ["3.10"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: python -m pip install "uv==${UV_VERSION}"
    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: /tmp/uv-cache
        key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ matrix.python-version }}-
    - name: Install system libraries
      run: |
        # Runner images ship without apt package lists, so refresh them first.
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-dev libldap2-dev libsasl2-dev # for bonsai
    - name: Install dependencies
      run: uv sync --locked
    - name: Check requirements.txt matches uv.lock
      run: |
        uv export --no-dev --no-hashes --no-emit-project --frozen -q -o requirements.txt
        git diff --exit-code requirements.txt || { echo "::error::requirements.txt is stale; regenerate it (see README)"; exit 1; }
    - name: Lint with pylint
      run: uv run --no-sync pylint --recursive y server
    - name: Minimize uv cache
      if: always()
      run: uv cache prune --ci
