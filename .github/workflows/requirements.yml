name: Requirements sync
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Checks the dependency files agree; runs once (no Python matrix) and installs nothing but uv.
#   pyproject.toml  --(uv lock)-->  uv.lock  --(uv export)-->  requirements.txt (used by production)
jobs:
  check:
    name: pyproject.toml / uv.lock / requirements.txt in sync
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/tag=infra
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      run: python -m pip install "uv==0.13.5"  # keep in step with .github/actions/setup-python-uv
    - name: uv.lock matches pyproject.toml
      run: |
        uv lock --locked || { echo "::error file=uv.lock::uv.lock is out of date with pyproject.toml; run 'uv lock' and commit it"; exit 1; }
    - name: requirements.txt matches uv.lock
      run: |
        uv export --no-dev --no-hashes --no-emit-project --frozen -q -o requirements.txt
        git diff --exit-code requirements.txt || { echo "::error file=requirements.txt::requirements.txt is stale; regenerate it with the uv export command in README.md and commit it"; exit 1; }
